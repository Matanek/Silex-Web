<VirtualHost *:80>
    ServerName silex-lang.org
    DocumentRoot /srv/silex/web/current/public

    <Directory /srv/silex/web/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm-silex-web.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/apache2/silex-lang.org-error.log
    CustomLog /var/log/apache2/silex-lang.org-access.log combined
</VirtualHost>
