<VirtualHost *:80>
    ServerName silex.nekmata.com

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog /var/log/apache2/silex.nekmata.com-error.log
    CustomLog /var/log/apache2/silex.nekmata.com-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName silex.nekmata.com
    DocumentRoot /srv/silex/web/current/public

    <Directory /srv/silex/web/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /var/log/apache2/silex.nekmata.com-error.log
    CustomLog /var/log/apache2/silex.nekmata.com-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/silex.nekmata.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/silex.nekmata.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
