[silex-web]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-silex-web.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Atomic releases change the target behind /srv/silex/web/current.
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 0
php_admin_value[opcache.revalidate_path] = 1
